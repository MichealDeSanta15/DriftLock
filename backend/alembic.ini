# Alembic Configuration
# the sqlalchemy.url is set by get_sqlalchemy_url() in env.py
# the ini_version is from alembic setup

[alembic]
sqlalchemy.url = driver://user:password@localhost/dbname
script_location = alembic
sqlalchemy.echo = false
sqlalchemy.echo_pool = false
sqlalchemy.pool_pre_ping = true
sqlalchemy.max_overflow = 10
sqlalchemy.pool_size = 5

# revision identifiers, used by Alembic.
file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present
# allows the alembic to be imported as a package, so that the
# versions/ directory is its subpackage
# subdirectory in alembic/ that holds .py migration files
version_path_separator = /

# the output encoding used when revision files
# are written from script.py.mako
output_encoding = utf-8

sqlalchemy.track_on_commit = false

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
