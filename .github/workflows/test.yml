# GitHub Actions CI/CD for DriftLock Backend
#
# Automated testing on every push and pull request:
# - Runs pytest with coverage against PostgreSQL 15
# - Tests code quality (flake8, mypy, black)
# - Verifies database migrations
# - Proper Python path and working directories
#
# Tests must pass before merging to main

name: Test Backend

on:
  push:
    branches: [main, develop, 'feat/**']
    paths:
      - 'backend/**'
      - 'requirements.txt'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'requirements.txt'
      - '.github/workflows/test.yml'

jobs:
  test:
    name: Test Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    working-directory: ./

    strategy:
      matrix:
        python-version: ["3.11"]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: driftlock_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/driftlock_test
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify Python path
        run: |
          echo "Current directory: $(pwd)"
          echo "Python path: $PYTHONPATH"
          echo "Backend module location:"
          ls -la backend/
          python -c "import sys; print('Python path:', sys.path)"

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -U postgres -d driftlock_test; do
            echo "Waiting for PostgreSQL..."
            sleep 1
          done
        env:
          PGPASSWORD: postgres

      - name: Run database migrations
        run: |
          echo "Running migrations..."
          cd backend
          alembic upgrade head
          echo "✓ Migrations completed"

      - name: Verify migrations
        run: |
          cd backend
          echo "Migration status:"
          alembic current
          echo ""
          echo "Migration history:"
          alembic history --verbose

      - name: Run integration tests
        run: |
          echo "Running integration tests..."
          cd backend
          pytest tests/integration_test.py -v --tb=short --cov=. --cov-report=xml --cov-report=term-missing
          echo "✓ Integration tests completed"

      - name: Run all tests
        run: |
          echo "Running all tests..."
          cd backend
          pytest tests/ -v --tb=short --cov=. --cov-report=xml --cov-report=term-missing
          echo "✓ All tests completed"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
        continue-on-error: true

  lint:
    name: Lint Backend Code
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run flake8
        run: |
          flake8 backend/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 backend/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        continue-on-error: true

      - name: Run mypy type checking
        run: |
          mypy backend/ --ignore-missing-imports --no-error-summary
        continue-on-error: true

      - name: Check code formatting with black
        run: |
          black backend/ --check
        continue-on-error: true

  migrations:
    name: Test Database Migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: driftlock_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/driftlock_test
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -U postgres -d driftlock_test; do
            echo "Waiting for PostgreSQL..."
            sleep 1
          done
        env:
          PGPASSWORD: postgres

      - name: Run migrations
        run: |
          echo "Applying migrations..."
          cd backend
          alembic upgrade head
          echo "✓ Migrations applied successfully"

      - name: Verify migrations
        run: |
          cd backend
          echo "Current migration version:"
          alembic current
          echo ""
          echo "Migration history:"
          alembic history --verbose
