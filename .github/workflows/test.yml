# GitHub Actions CI/CD for DriftLock Backend (MVP)
#
# Lightweight workflow for MVP:
# - Runs code quality checks (flake8)
# - Runs basic tests with mocked database
# - No real database migrations (done locally)
#
# Database setup validated locally; CI focuses on code quality + tests

name: Test Backend

on:
  push:
    branches: [main, develop, 'feat/**']
    paths:
      - 'backend/**'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/test.yml'

jobs:
  test:
    name: Test Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run flake8 linting
        run: |
          flake8 backend/ --count --select=E9,F63,F7,F82 --show-source --statistics
          echo "✓ Linting passed"

      - name: Run tests
        run: |
          cd backend
          pytest tests/ -v --tb=short
          echo "✓ All tests passed"
